<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Доступ до бази · Italica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" />
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#faf6f0;color:#1a1a1a}
.bar{background:#fff;border-bottom:1px solid #e9e2d8;padding:14px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bar b{font-size:16px}.bar a{color:#c25527;font-weight:600;text-decoration:none;font-size:14px}
.wrap{max-width:640px;margin:28px auto;padding:0 20px 60px}
.card{background:#fff;border:1px solid #e9e2d8;border-radius:16px;padding:24px 26px}
h1{font-size:24px;margin:0 0 8px}p{color:#5c5750;margin:0 0 14px;font-size:14.5px;line-height:1.55}
.cur{background:#faf6f0;border-radius:12px;padding:12px 16px;font-size:14.5px;margin-bottom:20px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #e9e2d8;font:inherit;font-size:15px}
input:focus{outline:none;border-color:#c25527}
button{margin-top:18px;font:inherit;font-weight:700;font-size:15px;padding:12px 18px;border-radius:10px;border:none;background:#c25527;color:#fff;cursor:pointer}
button:hover{background:#a4451e}
.st{margin-top:12px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="bar"><b>Pannello insegnante</b><a href="/admin/">← Тести</a><a href="/baza/" target="_blank">Відкрити базу ↗</a></div>
<main class="wrap"><div class="card">
  <h1>Доступ до бази для викладачів</h1>
  <p>Усі викладачі входять на <b>/baza</b> з одним спільним логіном і паролем. Коли викладач іде з Італіки — змініть пароль тут: усіх одразу розлогінить, і зайти зможуть лише ті, кому ви надішлете новий пароль.</p>
  <div class="cur" id="cur">Завантаження…</div>
  <form id="f">
    <label for="u">Логін</label><input id="u" required autocomplete="off" />
    <label for="p">Новий пароль</label><input id="p" required minlength="6" autocomplete="new-password" placeholder="мінімум 6 символів" />
    <button>Зберегти новий логін і пароль</button>
    <div class="st" id="st"></div>
  </form>
</div></main>
<script>
const fmt=d=>d?new Date(d).toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"ще не змінювався";
async function load(){const r=await fetch("/api/admin/baza/access");const i=await r.json();document.getElementById("cur").innerHTML=`Поточний логін: <b>${i.user.replace(/</g,"&lt;")}</b><br>Пароль востаннє змінено: ${fmt(i.changedAt)}`;document.getElementById("u").value=i.user;}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const st=document.getElementById("st");
  if(!confirm("Змінити пароль? Усі викладачі, які зараз увійшли, будуть розлогінені."))return;
  const r=await fetch("/api/admin/baza/access",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:document.getElementById("u").value,password:document.getElementById("p").value})});
  if(r.ok){st.style.color="#3f8f5f";st.textContent="✓ Збережено. Надішліть новий пароль викладачам.";document.getElementById("p").value="";load();}
  else{st.style.color="#c94c4c";st.textContent=(await r.json()).error||"Помилка";}};
load();
</script>
</body>
</html>
