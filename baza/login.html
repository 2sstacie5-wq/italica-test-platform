<form class="card" id="f">
  <img src="/images/logo.png" alt="italica" />
  <h1>Внутрішня база <em>Італіки</em></h1>
  <p>Увійдіть, щоб побачити матеріали для викладачів.</p>
  <input id="user" placeholder="Логін" autocomplete="username" autocapitalize="off" spellcheck="false" required />
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required style="margin-top:10px" />
  <button id="btn">Увійти</button>
  <div class="err" id="err"></div>
  <div class="hint">Не пам'ятаєте логін чи пароль? Напишіть адміністратору.</div>
</form>
<script>
const f=document.getElementById("f"), btn=document.getElementById("btn"), err=document.getElementById("err");
f.addEventListener("submit", async (e) => {
  e.preventDefault(); err.textContent=""; btn.disabled=true;
  try {
    const r = await fetch("/api/baza/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({user: document.getElementById("user").value, password: document.getElementById("pw").value})});
    if (r.ok) { location.href = "/baza/"; return; }
    err.textContent = r.status === 429 ? "Забагато спроб. Спробуйте за кілька хвилин." : "Неправильний логін або пароль.";
  } catch (x) { err.textContent = "Немає зв'язку. Спробуйте ще раз."; }
  btn.disabled=false;
});
</script>
