<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Вхід · Внутрішня база Італіки</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/images/favicon.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" />
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Montserrat,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#faf6f0;color:#1a1a1a;padding:20px}
.card{background:#fff;border:1px solid #e9e2d8;border-radius:20px;padding:36px 32px;max-width:420px;width:100%;box-shadow:0 6px 30px rgba(0,0,0,.05);text-align:center}
img{width:72px;height:72px;border-radius:14px;margin-bottom:16px}
h1{font-size:23px;margin:0 0 6px;font-weight:800}
p{margin:0 0 22px;color:#767066;font-size:15px;line-height:1.5}
input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #e9e2d8;font:inherit;font-size:17px;text-align:center}
input:focus{outline:none;border-color:#c25527}
button{margin-top:12px;width:100%;padding:14px;border:none;border-radius:12px;background:#c25527;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#a4451e}
button:disabled{opacity:.5}
.err{margin-top:14px;color:#c94c4c;font-size:14px;font-weight:600;min-height:20px}
.hint{margin-top:18px;font-size:13px;color:#767066}
body{background:#F4EEE4;position:relative;overflow:hidden}
.card{border-radius:24px;position:relative}
h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:26px;line-height:1.15;letter-spacing:-.02em}
h1 em{color:#E5491E}
input{border-radius:999px}
button{border-radius:999px;background:#E5491E}
button:hover{background:#C23A12}
</style>
</head>
<body>
<svg class="flower" style="position:fixed;right:-50px;top:-40px;width:380px;color:#E5491E;opacity:.6;pointer-events:none" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
  <g transform="translate(100 100)">
    <ellipse rx="9" ry="78" transform="rotate(14) translate(0 -62)"/>
    <ellipse rx="7" ry="58" transform="rotate(-62) translate(0 -48)"/>
    <ellipse rx="7" ry="62" transform="rotate(58) translate(0 -50)"/>
    <ellipse rx="6" ry="40" transform="rotate(-24) translate(0 -34)"/>
    <ellipse rx="6" ry="44" transform="rotate(100) translate(0 -36)"/>
    <ellipse rx="6" ry="46" transform="rotate(-108) translate(0 -38)"/>
    <ellipse rx="5" ry="34" transform="rotate(160) translate(0 -28)"/>
    <ellipse rx="5" ry="30" transform="rotate(-160) translate(0 -25)"/>
    <ellipse rx="5" ry="36" transform="rotate(200) translate(0 -30)"/>
  </g>
</svg>
<form class="card" id="f">
  <img src="/images/logo.png" alt="italica" />
  <h1>Внутрішня база <em>Італіки</em></h1>
  <p>Увійдіть, щоб побачити матеріали для викладачів.</p>
  <input id="user" placeholder="Логін" autocomplete="username" autocapitalize="off" spellcheck="false" required />
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required style="margin-top:10px" />
  <button id="btn">Увійти</button>
  <div class="err" id="err"></div>
  <div class="hint">Не пам'ятаєте логін чи пароль? Напишіть адміністратору.</div>
</form>
<script>
const f=document.getElementById("f"), btn=document.getElementById("btn"), err=document.getElementById("err");
f.addEventListener("submit", async (e) => {
  e.preventDefault(); err.textContent=""; btn.disabled=true;
  try {
    const r = await fetch("/api/baza/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({user: document.getElementById("user").value, password: document.getElementById("pw").value})});
    if (r.ok) { location.href = "/baza/"; return; }
    err.textContent = r.status === 429 ? "Забагато спроб. Спробуйте за кілька хвилин." : "Неправильний логін або пароль.";
  } catch (x) { err.textContent = "Немає зв'язку. Спробуйте ще раз."; }
  btn.disabled=false;
});
</script>
</body>
</html>
